[workspace]
resolver = "3"
members = [
    "crates/borderless-core",
    "crates/borderless-native",
    "crates/borderless-runtime",
    "crates/borderless-cli",
    "crates/borderless-gui",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Borderless Oxide contributors"]
repository = "https://github.com/Sanzentyo/borderless-rs"

[workspace.metadata.windows-rs]
rev = "db87ba9940e49e84fbacb1fe494ec81a2a7690db"

[workspace.dependencies]
anyhow = "1.0.102"
bitflags = { version = "2.11.1", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
once_cell = "1.21.3"
png = "0.18.1"
ractor = { version = "0.15.13", features = ["async-trait", "monitors"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { git = "https://github.com/microsoft/windows-rs", rev = "db87ba9940e49e84fbacb1fe494ec81a2a7690db", package = "windows", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "db87ba9940e49e84fbacb1fe494ec81a2a7690db", package = "windows-reactor" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "db87ba9940e49e84fbacb1fe494ec81a2a7690db", package = "windows-reactor-setup" }

borderless-core = { path = "crates/borderless-core" }
borderless-native = { path = "crates/borderless-native" }
borderless-runtime = { path = "crates/borderless-runtime" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
